name: Build and Deploy Test

on:
  push:
    branches:
      - test
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/btcfoxman/localminidrama/drama-backend
  FRONTWEB_IMAGE: ghcr.io/btcfoxman/localminidrama/drama-frontweb
  DEPLOY_DIR: /home/btcfoxman/docker/drama

jobs:
  build:
    name: Build and Push Images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend-node
          file: ./backend-node/Dockerfile
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:test-latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}

      - name: Build and push frontweb
        uses: docker/build-push-action@v6
        with:
          context: ./frontweb
          file: ./frontweb/Dockerfile
          push: true
          tags: |
            ${{ env.FRONTWEB_IMAGE }}:test-latest
            ${{ env.FRONTWEB_IMAGE }}:${{ github.sha }}

  deploy:
    name: Deploy on 3.6 Runner
    needs: build
    runs-on: [self-hosted, linux, x64, repo-localminidrama]
    steps:
      - name: Login to GHCR
        run: |
          set -euo pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login "${{ env.REGISTRY }}" -u "${{ github.actor }}" --password-stdin

      - name: Deploy drama services
        run: |
          set -euo pipefail
          test -d "${{ env.DEPLOY_DIR }}" || { echo "Missing deploy dir: ${{ env.DEPLOY_DIR }}"; exit 1; }
          test -f "${{ env.DEPLOY_DIR }}/docker-compose.yml" || { echo "Missing docker-compose.yml. Run prepare-drama-host.sh first."; exit 1; }
          test -f "${{ env.DEPLOY_DIR }}/config/config.yaml" || { echo "Missing config/config.yaml. Run prepare-drama-host.sh first."; exit 1; }

          cd "${{ env.DEPLOY_DIR }}"
          docker compose pull
          docker compose up -d --remove-orphans

          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3013/health >/dev/null; then
              docker compose ps
              exit 0
            fi
            sleep 2
          done

          docker compose ps
          docker compose logs --tail=200
          echo "Deployment health check failed."
          exit 1
